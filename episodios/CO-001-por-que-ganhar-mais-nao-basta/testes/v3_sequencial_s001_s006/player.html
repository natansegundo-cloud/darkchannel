<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Capital Oculto — teste sequencial V3</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111111; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, 177.777vh); height: min(56.25vw, 100vh); background: #F4F3EF; }
    #status { position: fixed; left: 16px; bottom: 12px; color: #F4F3EF; font: 600 13px/1.2 system-ui, sans-serif; opacity: .72; }
  </style>
</head>
<body>
  <canvas id="stage" width="1920" height="1080"></canvas>
  <div id="status">carregando teste sequencial…</div>
  <script>
    const canvas = document.querySelector('#stage');
    const ctx = canvas.getContext('2d', { alpha: false });
    const statusNode = document.querySelector('#status');
    const BG = '#F4F3EF';

    const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
    const ease = value => 1 - Math.pow(1 - clamp(value), 3);

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    function drawImageMotion(image, scene, time, opacity = 1) {
      const local = clamp((time - scene.start) / Math.max(.01, scene.end - scene.start));
      const scale = 1 + ease(local) * .018;
      const drift = scene.scene_id === 'S002' ? -16 * ease(local) : scene.scene_id === 'S006' ? 12 * ease(local) : 0;
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.translate(960 + drift, 540);
      ctx.scale(scale, scale);
      ctx.drawImage(image, -960, -540, 1920, 1080);
      ctx.restore();
    }

    function applyNarrativeMask(scene, time) {
      const local = time - scene.start;
      ctx.save();
      ctx.fillStyle = BG;
      if (scene.scene_id === 'S002' && local < 1.2) {
        const reveal = ease(local / 1.2);
        ctx.fillRect(490 + 1330 * reveal, 250, 1400 * (1 - reveal), 650);
      }
      if (scene.scene_id === 'S004' && local < 1.6) {
        const reveal = ease(local / 1.6);
        ctx.fillRect(70, 590 + 400 * reveal, 900, 410 * (1 - reveal));
      }
      if (scene.scene_id === 'S005') {
        const first = scene.start + 1.0;
        const second = scene.start + 5.4;
        const third = scene.start + 9.2;
        if (time < first) ctx.fillRect(170, 250, 1580, 680);
        else if (time < second) ctx.fillRect(700, 250, 1050, 680);
        else if (time < third) ctx.fillRect(1280, 250, 470, 680);
      }
      ctx.restore();
    }

    function renderFrame(time, timeline, images) {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, 1920, 1080);
      let index = timeline.scenes.findIndex(scene => time >= scene.start && time < scene.end);
      if (index < 0) index = time < 0 ? 0 : timeline.scenes.length - 1;
      const scene = timeline.scenes[index];
      const transition = timeline.transition_seconds;
      const fadeStart = scene.end - transition;
      drawImageMotion(images[index], scene, time, 1);
      applyNarrativeMask(scene, time);
      if (index < timeline.scenes.length - 1 && time > fadeStart) {
        const alpha = ease((time - fadeStart) / transition);
        drawImageMotion(images[index + 1], timeline.scenes[index + 1], timeline.scenes[index + 1].start, alpha);
      }
      statusNode.textContent = `${scene.scene_id} · ${time.toFixed(1)}s`;
    }

    async function start() {
      const timeline = await fetch('timeline.json').then(response => response.json());
      const images = await Promise.all(timeline.scenes.map(scene => loadImage(scene.file)));
      renderFrame(0, timeline, images);

      const audioContext = new AudioContext({ sampleRate: 48000 });
      const audioBuffer = await fetch(timeline.audio).then(response => response.arrayBuffer()).then(buffer => audioContext.decodeAudioData(buffer));
      const source = audioContext.createBufferSource();
      source.buffer = audioBuffer;
      const audioDestination = audioContext.createMediaStreamDestination();
      source.connect(audioDestination);

      const videoStream = canvas.captureStream(30);
      const combined = new MediaStream([...videoStream.getVideoTracks(), ...audioDestination.stream.getAudioTracks()]);
      const preferredTypes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
      const mimeType = preferredTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';
      const recorder = new MediaRecorder(combined, { mimeType, videoBitsPerSecond: 6000000, audioBitsPerSecond: 128000 });
      const chunks = [];
      recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
      recorder.onerror = event => fetch('/error', { method: 'POST', body: String(event.error || event) });
      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
        const response = await fetch('/save', {
          method: 'POST',
          headers: { 'Content-Type': blob.type, 'X-Duration': String(audioBuffer.duration) },
          body: blob
        });
        statusNode.textContent = response.ok ? 'exportação concluída' : 'falha ao salvar';
      };

      await audioContext.resume();
      const startAt = audioContext.currentTime + .15;
      recorder.start(1000);
      source.start(startAt);
      function tick() {
        const time = Math.max(0, audioContext.currentTime - startAt);
        renderFrame(time, timeline, images);
        if (time < audioBuffer.duration + .2) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      source.onended = () => setTimeout(() => recorder.stop(), 350);
    }

    start().catch(error => {
      statusNode.textContent = `erro: ${error.message}`;
      fetch('/error', { method: 'POST', body: error.stack || String(error) });
    });
  </script>
</body>
</html>
