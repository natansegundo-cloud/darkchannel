<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Capital Oculto — Art Direction POC V2</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
    svg{display:block;width:100vw;height:100vh}
    text{font-family:Bahnschrift,"Arial Narrow",Arial,sans-serif;font-weight:900}
    .paper{fill:#f4f3ef}.ink{fill:#111}.lime{fill:#c4e538}.amber{fill:#e8a33d}.ash{fill:#d9d9d4}
    .outline{fill:none;stroke:#111;stroke-width:5}.hair{fill:none;stroke:#111;stroke-width:12;stroke-linecap:round}
    .track{fill:none;stroke:#c4e538;stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
    .micro{font-size:28px;font-weight:800;letter-spacing:4px}.small{font-size:42px;letter-spacing:2px}
  </style>
</head>
<body><svg id="stage" viewBox="0 0 1920 1080" role="img"></svg>
<script>
const NS='http://www.w3.org/2000/svg';
const stage=document.querySelector('#stage');
const frame=new URLSearchParams(location.search).get('frame')||'CONTACT';
const defs=`<defs>
  <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1" fill="#111" opacity=".07"/><circle cx="15" cy="13" r=".8" fill="#111" opacity=".05"/></pattern>
  <clipPath id="canvas"><rect width="1920" height="1080"/></clipPath>
</defs>`;
const base=content=>`${defs}<rect width="1920" height="1080" class="paper"/><rect width="1920" height="1080" fill="url(#grain)"/>${content}`;

const frames={
S013_A:()=>base(`
  <circle cx="1700" cy="176" r="25" class="lime"/>
  <text x="74" y="690" class="ink" font-size="292" letter-spacing="-18">EXCEÇÃO</text>
  <path d="M78 786H460" class="track"/>
  <text x="80" y="858" class="micro ink">UMA VEZ. FORA DO PADRÃO.</text>
  <text x="1738" y="965" class="small ink" text-anchor="end">01</text>`),
S013_B:()=>base(`
  <g clip-path="url(#canvas)">
    <text x="-130" y="235" class="outline" font-size="188" letter-spacing="-10">EXCEÇÃO</text>
    <text x="365" y="425" class="ink" font-size="188" letter-spacing="-10">EXCEÇÃO</text>
    <text x="855" y="615" class="outline" font-size="188" letter-spacing="-10">EXCEÇÃO</text>
    <text x="1340" y="805" class="ink" font-size="188" letter-spacing="-10">EXCEÇÃO</text>
    <text x="-40" y="1010" class="lime" font-size="188" letter-spacing="-10">EXCEÇÃO</text>
  </g>
  <path d="M150 140L1760 940" class="hair" opacity=".22"/>
  <g transform="rotate(-63 1380 270)">
    <text x="1380" y="270" class="small ink" text-anchor="middle" letter-spacing="8">DIA APÓS DIA APÓS DIA</text>
  </g>`),
S013_C:()=>`${defs}<rect width="1920" height="1080" class="ink"/>
  <g clip-path="url(#canvas)">
    <text x="-40" y="650" fill="#f4f3ef" font-size="330" letter-spacing="-20">ROTINA</text>
    <text x="90" y="900" class="lime" font-size="82" letter-spacing="18">DIA APÓS DIA APÓS DIA</text>
    <path d="M90 960H1810" stroke="#c4e538" stroke-width="20"/>
  </g>
  <circle cx="1790" cy="134" r="34" class="lime"/>
  <text x="1760" y="1030" fill="#f4f3ef" class="micro" text-anchor="end">A EXCEÇÃO PERDEU A RARIDADE</text>`,

S014_A:()=>base(`
  <path d="M1130 0H1920V1080H1510L980 790Z" class="ink"/>
  <text x="1810" y="505" fill="#f4f3ef" font-size="270" letter-spacing="-16" text-anchor="end">RENDA</text>
  <text x="1810" y="610" class="lime" font-size="40" letter-spacing="6" text-anchor="end">REFERÊNCIA FIXA</text>
  <path d="M160 840H770" class="hair" opacity=".18"/>
  <circle cx="160" cy="840" r="22" class="amber"/>`),
S014_B:()=>base(`
  <path d="M1460 0H1920V1080H1370L1215 705Z" class="ink"/>
  <text x="1810" y="270" fill="#f4f3ef" font-size="150" letter-spacing="-8" text-anchor="end">RENDA</text>
  <g transform="rotate(-8 140 820)">
    <text x="140" y="820" class="ink" font-size="164" letter-spacing="-10">EXPECTATIVA</text>
    <path d="M146 868H1320" class="track"/>
  </g>
  <path d="M155 935L450 895M510 875L805 835M865 815L1160 775" stroke="#111" stroke-width="6" opacity=".22"/>
  <circle cx="1290" cy="690" r="34" class="lime"/>`),
S014_C:()=>base(`
  <path d="M0 0H1920V430H0Z" class="ink"/>
  <text x="1800" y="335" fill="#f4f3ef" opacity=".36" font-size="150" letter-spacing="-8" text-anchor="end">RENDA</text>
  <text x="95" y="565" fill="#111" opacity=".28" font-size="82" letter-spacing="-4">EXPECTATIVA</text>
  <rect x="0" y="430" width="1920" height="48" class="lime"/>
  <circle cx="960" cy="454" r="76" class="lime"/>
  <text x="960" y="835" class="ink" font-size="170" letter-spacing="-9" text-anchor="middle">ALCANÇOU</text>
  <path d="M760 900H1160" class="hair"/>`),

S018_A:()=>base(`
  <text x="90" y="875" class="ink" font-size="176" letter-spacing="-10">RENDA</text>
  <text x="1810" y="250" class="ink" font-size="150" letter-spacing="-9" text-anchor="end">BEM-ESTAR</text>
  <path d="M490 760C780 700 1090 440 1510 330" class="track"/>
  <circle cx="490" cy="760" r="38" class="ink"/><circle cx="1510" cy="330" r="38" class="lime"/>
  <text x="90" y="120" class="micro ink">RELAÇÃO POSITIVA — NA MÉDIA</text>`),
S018_B:()=>base(`
  <circle cx="350" cy="540" r="58" class="ink"/>
  <text x="90" y="450" class="ink" font-size="118" letter-spacing="-6">RENDA</text>
  <path d="M350 514C660 390 1010 120 1480 132L1480 188C1030 210 720 455 350 566Z" class="ink"/>
  <path d="M350 525C710 490 1010 555 1500 492L1500 552C1010 610 700 548 350 557Z" class="lime"/>
  <path d="M350 540C690 640 1040 900 1510 840L1510 894C1020 958 650 704 350 570Z" class="ink"/>
  <text x="1580" y="190" class="ink" font-size="90">A</text>
  <text x="1580" y="550" class="ink" font-size="90">B</text>
  <text x="1580" y="895" class="ink" font-size="90">C</text>
  <text x="90" y="1000" class="micro ink">UMA ORIGEM. TRÊS TRAJETÓRIAS.</text>`),
S018_C:()=>`${defs}<rect width="1920" height="1080" class="ink"/>
  <path d="M-80 850C280 800 430 600 730 390" fill="none" stroke="#c4e538" stroke-width="34" stroke-linecap="round"/>
  <path d="M-80 850C300 850 510 790 800 690" fill="none" stroke="#f4f3ef" stroke-width="18" stroke-linecap="round" opacity=".72"/>
  <path d="M-80 850C260 920 500 980 820 1020" fill="none" stroke="#c4e538" stroke-width="12" stroke-linecap="round" opacity=".7"/>
  <circle cx="-10" cy="850" r="70" class="lime"/>
  <path d="M820 0H1920V1080H690C820 890 900 650 850 420C820 270 780 130 820 0Z" class="paper"/>
  <text x="950" y="180" class="micro ink">EFEITO PEQUENO</text>
  <text x="950" y="555" class="ink" font-size="162" letter-spacing="-8">SEM LIMIAR</text>
  <text x="950" y="735" class="ink" font-size="162" letter-spacing="-8">UNIVERSAL</text>
  <rect x="950" y="810" width="700" height="28" class="lime"/>
  <text x="950" y="930" class="small ink">NENHUMA LINHA MÁGICA</text>`
};

function renderSingle(id){stage.innerHTML=frames[id]();stage.setAttribute('aria-label',id);}
function renderContact(){
  const ids=['S013_A','S013_B','S013_C','S014_A','S014_B','S014_C','S018_A','S018_B','S018_C'];
  const cardW=600,cardH=337.5,gapX=28,gapY=18,left=32,top=34;
  let body=`${defs}<rect width="1920" height="1080" fill="#111"/>`;
  ids.forEach((id,index)=>{const col=index%3,row=Math.floor(index/3),x=left+col*(cardW+gapX),y=top+row*(cardH+gapY);
    body+=`<g transform="translate(${x} ${y})"><svg width="${cardW}" height="${cardH}" viewBox="0 0 1920 1080">${frames[id]().replace(defs,'')}</svg><rect width="${cardW}" height="${cardH}" fill="none" stroke="#f4f3ef" stroke-opacity=".35" stroke-width="2"/><rect x="14" y="14" width="110" height="34" rx="17" fill="#111"/><text x="69" y="38" fill="#f4f3ef" font-size="20" text-anchor="middle" letter-spacing="1">${id}</text></g>`;
  });stage.innerHTML=body;stage.setAttribute('aria-label','contact art direction POC V2');
}
if(frame==='CONTACT')renderContact();else if(frames[frame])renderSingle(frame);else throw new Error(`frame desconhecido: ${frame}`);
</script></body></html>
