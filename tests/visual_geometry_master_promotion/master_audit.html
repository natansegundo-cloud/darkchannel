<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Visual Geometry Master Promotion Audit</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font: 14px system-ui; }
    #measure { position: absolute; left: -10000px; top: 0; width: 1920px; height: 1080px; }
    svg { width: 1920px; height: 1080px; }
  </style>
</head>
<body>
  <div id="measure"></div>
  <script>
    const SOURCES = {
      S005: 'instances/s005_from_master.svg',
      S006: 'instances/s006_from_master.svg'
    };
    const PADDING = { display: 20, headline: 24, label: 16, micro: 10 };
    const measure = document.querySelector('#measure');

    const expanded = (box, padding) => ({
      x: box.x - padding, y: box.y - padding,
      width: box.width + padding * 2, height: box.height + padding * 2
    });
    const pointIn = (point, box) => point.x >= box.x && point.x <= box.x + box.width && point.y >= box.y && point.y <= box.y + box.height;
    const boxesHit = (a, b) => a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;

    function textZones(svg) {
      return [...svg.querySelectorAll('text')].map((element, index) => {
        const className = element.getAttribute('class') || 'micro';
        const kind = className.includes('display') ? 'display' : className.includes('headline') ? 'headline' : className.includes('label') ? 'label' : 'micro';
        const bbox = element.getBBox();
        return {
          id: `${svg.dataset.sceneId}-text-${index}`,
          text: element.textContent.trim(),
          zone: expanded(bbox, PADDING[kind])
        };
      });
    }

    function geometryType(element) {
      return element.dataset.geometryType || element.closest('[data-geometry-type]')?.dataset.geometryType || null;
    }

    function hits(element, zone) {
      const tag = element.tagName.toLowerCase();
      if (tag === 'path' || tag === 'line' || tag === 'polyline') {
        const length = element.getTotalLength();
        const samples = Math.max(120, Math.ceil(length / 6));
        for (let index = 0; index <= samples; index += 1) {
          if (pointIn(element.getPointAtLength(length * index / samples), zone)) return true;
        }
        return false;
      }
      return boxesHit(element.getBBox(), zone);
    }

    function samplesFor(scene) {
      const samples = [{ subbeat_id: `${scene.scene_id}.scene`, timestamp: scene.start }];
      const subbeats = [...scene.visual_subbeats].sort((a, b) => a.time - b.time);
      subbeats.forEach((subbeat, index) => {
        const end = index + 1 < subbeats.length ? subbeats[index + 1].time : scene.end;
        samples.push({ subbeat_id: subbeat.subbeat_id, timestamp: subbeat.time });
        samples.push({ subbeat_id: subbeat.subbeat_id, timestamp: (subbeat.time + end) / 2 });
        samples.push({ subbeat_id: subbeat.subbeat_id, timestamp: end });
      });
      samples.push({ subbeat_id: `${scene.scene_id}.scene`, timestamp: scene.end });
      return samples;
    }

    async function loadSvg(sceneId) {
      const source = await fetch(SOURCES[sceneId]).then(response => response.text());
      const parsed = new DOMParser().parseFromString(source, 'image/svg+xml').documentElement;
      const svg = document.importNode(parsed, true);
      svg.dataset.sceneId = sceneId;
      return svg;
    }

    async function auditScene(scene) {
      const svg = await loadSvg(scene.scene_id);
      measure.replaceChildren(svg);
      await document.fonts.ready;
      const zones = textZones(svg);
      const structural = [...svg.querySelectorAll('path,line,polyline,polygon,rect')]
        .filter(element => geometryType(element));
      const baseFindings = [];
      for (const element of structural) {
        for (const text of zones) {
          if (!hits(element, text.zone)) continue;
          baseFindings.push({
            element_a: geometryType(element),
            element_b: text.id,
            collision_type: 'GEOMETRY_TYPE_INTERSECTION',
            severity: 'ERROR'
          });
        }
      }
      const samples = samplesFor(scene);
      const findings = samples.flatMap(sample => baseFindings.map(finding => ({
        scene_id: scene.scene_id,
        subbeat_id: sample.subbeat_id,
        timestamp: sample.timestamp,
        ...finding
      })));
      return { scene_id: scene.scene_id, samples: samples.length, errors: findings.length, findings };
    }

    async function run() {
      const manifest = await fetch('../audiovisual_pilot_s001_s006_v2_wordboundary/manifest/scene_manifest_wordboundary.json').then(response => response.json());
      const scenes = manifest.scenes.filter(scene => scene.scene_id === 'S005' || scene.scene_id === 'S006');
      const audits = [];
      for (const scene of scenes) audits.push(await auditScene(scene));
      await fetch('/result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          browser_geometry: true,
          fonts_ready: document.fonts.status === 'loaded',
          timing_source: 'WORD_BOUNDARY_REAL_EXISTING',
          instance_geometry_override: false,
          scenes: audits
        })
      });
    }

    run().catch(error => fetch('/error', { method: 'POST', body: error.stack || String(error) }));
  </script>
</body>
</html>
