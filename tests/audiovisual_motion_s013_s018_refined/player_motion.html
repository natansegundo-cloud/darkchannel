<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Capital Oculto — motion candidate S001–S012</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111111; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, 177.777vh); height: min(56.25vw, 100vh); background: #F4F3EF; }
    #status { position: fixed; left: 14px; bottom: 10px; color: #F4F3EF; font: 600 12px/1.2 system-ui, sans-serif; opacity: .65; }
  </style>
</head>
<body>
  <canvas id="stage" width="1920" height="1080"></canvas>
  <div id="status">carregando motion candidate S001–S012…</div>
  <script>
    const canvas = document.querySelector('#stage');
    const ctx = canvas.getContext('2d', { alpha: false });
    const statusNode = document.querySelector('#status');
    const QUERY = new URLSearchParams(location.search);
    const SILENT = QUERY.get('silent') === '1';
    const PREVIEW_TIME = QUERY.has('preview') ? Number(QUERY.get('preview')) : NaN;
    const P = {
      black: '#111111', lime: '#C4E538', amber: '#E8A33D',
      offWhite: '#F4F3EF', gray: '#D9D9D4'
    };
    const FONT = "Bahnschrift, 'Arial Narrow', Arial, sans-serif";

    const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
    const easeOut = value => 1 - Math.pow(1 - clamp(value), 3);
    const lerp = (start, end, value) => start + (end - start) * clamp(value);
    const progress = (time, event) => {
      if (!event) return 0;
      return easeOut((time - event.time) / Math.max(.001, event.end_time - event.time));
    };
    const eventById = (scene, id) => scene.events.find(event => event.event_id === id);

    function fillText(text, x, y, size, weight = 900, color = P.black, align = 'left', alpha = 1, letterSpacing = 0) {
      ctx.save();
      ctx.globalAlpha = clamp(alpha);
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px ${FONT}`;
      ctx.textAlign = align;
      ctx.textBaseline = 'alphabetic';
      if (letterSpacing && ctx.letterSpacing !== undefined) {
        ctx.letterSpacing = `${letterSpacing}px`;
      }
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function background() {
      ctx.fillStyle = P.offWhite;
      ctx.fillRect(0, 0, 1920, 1080);
      ctx.fillStyle = 'rgba(17,17,17,.045)';
      for (let y = 18; y < 1080; y += 18) {
        for (let x = 18; x < 1920; x += 18) ctx.fillRect(x, y, 1.2, 1.2);
      }
    }

    function roundedRect(x, y, width, height, radius, color, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = clamp(alpha);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      ctx.fill();
      ctx.restore();
    }

    // ========================================================
    // S004 — STATEMENT_STACK (CO-COMP-05A)
    // "Você não precisa ter feito nenhuma compra absurda."
    // Reveal semântico da negação:
    // 1. "O PROBLEMA" aparece discreto
    // 2. "NÃO É" entra como elemento dominante
    // 3. pequena pausa visual
    // 4. "UMA COMPRA" aparece
    // 5. "ABSURDA" fecha a frase
    // 6. underline estrutural finaliza
    // ========================================================
    
    function formatMoney(value) { return Math.round(value).toLocaleString('pt-BR'); }

    function dashedLine(x1, y, x2, color, width, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.setLineDash([18, 14]);
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();
      ctx.restore();
    }
function drawS001(scene, time) {
      background();
      const entry = progress(time, eventById(scene, 'S001-E01'));
      const counter = progress(time, eventById(scene, 'S001-E02'));
      const settle = progress(time, eventById(scene, 'S001-E03'));
      const value = lerp(3500, 4200, counter);
      const settleScale = 1 + .018 * (1 - settle) * Math.sin(settle * Math.PI);

      ctx.save();
      ctx.globalAlpha = .08 * entry;
      fillText('4.200', -40, 750, 640, 900, P.gray, 'left', entry);
      ctx.restore();

      ctx.save();
      ctx.translate(-20, 730);
      ctx.scale(settleScale, settleScale);
      fillText(formatMoney(value), 0, 0, 640, 900, P.black, 'left', entry);
      ctx.restore();

      fillText('R$', 96, 170, 96, 800, P.black, 'left', entry);
      fillText('+ R$ 700', 1824, 955, 88, 800, P.lime, 'right', settle);
      fillText('SEU SALÁRIO AUMENTOU', 96, 960, 28, 700, P.black, 'left', entry);
    }

    function dashedLine(x1, y, x2, color, width, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.setLineDash([18, 14]);
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();
      ctx.restore();
    }

    function drawS002(scene, time) {
      background();
      const oldReveal = progress(time, eventById(scene, 'S002-E01'));
      const currentReveal = progress(time, eventById(scene, 'S002-E02'));
      const baselineMove = progress(time, eventById(scene, 'S002-E03'));
      const oldDeemphasis = progress(time, eventById(scene, 'S002-E04'));
      const normalReveal = progress(time, eventById(scene, 'S002-E05'));
      const local = time - scene.start;
      const carry = easeOut(local / .42);
      const currentAlpha = Math.max(currentReveal, .72 + .28 * carry);

      fillText('AGORA', 96, 140, 48, 800, P.black, 'left', currentAlpha);
      const carryX = lerp(-20, 96, carry);
      const carryY = lerp(730, 340, carry);
      const carrySize = lerp(640, 180, carry);
      fillText('R$ 4.200', carryX, carryY, carrySize, 900, P.black, 'left', currentAlpha);

      const oldAlpha = oldReveal * lerp(1, .42, oldDeemphasis);
      dashedLine(64, 760, 1856, P.gray, 4, oldReveal);
      fillText('R$ 3.500', 96, 700, 140, 900, P.gray, 'left', oldAlpha);
      fillText('ANTES', 96, 840, 22, 700, P.black, 'left', oldAlpha);

      const activeY = lerp(760, 464, baselineMove);
      roundedRect(64, activeY - 8, 1792, 16, 8, P.black, Math.max(.15, oldReveal));
      roundedRect(64, activeY - 4, 1336 * baselineMove, 8, 4, P.amber, baselineMove);

      if (baselineMove > 0) {
        ctx.save();
        ctx.strokeStyle = P.amber;
        ctx.fillStyle = P.amber;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(1600, 740);
        ctx.lineTo(1600, activeY + 56);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(1580, activeY + 66);
        ctx.lineTo(1600, activeY + 26);
        ctx.lineTo(1620, activeY + 66);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      fillText('A REFERÊNCIA SUBIU', 1824, 960, 28, 700, P.black, 'right', normalReveal);
      if (normalReveal > 0) {
        roundedRect(1380, 126, 444, 58, 16, P.amber, .16 * normalReveal);
        fillText('NOVO NORMAL', 1602, 166, 28, 800, P.black, 'center', normalReveal);
      }
    }

    function drawMassText(xCenter, alpha, title2, amount, detail) {
      fillText('GASTOS', xCenter, 400, 48, 800, P.offWhite, 'center', alpha);
      fillText(title2, xCenter, 460, 48, 800, P.offWhite, 'center', alpha);
      fillText(amount, xCenter, 600, 140, 900, P.offWhite, 'center', alpha);
      fillText(detail, xCenter, 680, 22, 700, P.offWhite, 'center', .5 * alpha);
    }

    function drawS003(scene, time) {
      background();
      const establish = progress(time, eventById(scene, 'S003-E01'));
      const leftAdvance = progress(time, eventById(scene, 'S003-E02'));
      const rightAdvance = progress(time, eventById(scene, 'S003-E03'));
      const settle = progress(time, eventById(scene, 'S003-E04'));
      const leftBoundary = lerp(510, 760, leftAdvance);
      const rightBoundary = lerp(1410, 1160, rightAdvance);
      const gap = Math.max(400, rightBoundary - leftBoundary);
      const compression = clamp((leftAdvance + rightAdvance) / 2);
      const value = lerp(700, 20, compression);

      ctx.fillStyle = P.black;
      ctx.fillRect(0, 0, leftBoundary, 1080);
      ctx.fillRect(rightBoundary, 0, 1920 - rightBoundary, 1080);
      ctx.save();
      ctx.globalAlpha = .12 * establish;
      ctx.fillStyle = P.lime;
      ctx.fillRect(leftBoundary, 0, gap, 1080);
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = P.lime;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(leftBoundary, 0);
      ctx.lineTo(leftBoundary, 1080);
      ctx.moveTo(rightBoundary, 0);
      ctx.lineTo(rightBoundary, 1080);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, leftBoundary, 1080);
      ctx.clip();
      drawMassText(leftBoundary / 2, establish, 'FIXOS', '2.8k', 'ALUGUEL • LUZ • MERCADO');
      ctx.restore();
      ctx.save();
      ctx.beginPath();
      ctx.rect(rightBoundary, 0, 1920 - rightBoundary, 1080);
      ctx.clip();
      drawMassText((rightBoundary + 1920) / 2, establish, 'NOVOS', '680', 'DELIVERY • STREAMING • PARCELA');
      ctx.restore();

      const center = (leftBoundary + rightBoundary) / 2;
      fillText('R$', center, 420, 72, 800, P.black, 'center', establish);
      fillText(formatMoney(value), center, 620, 180, 900, P.lime, 'center', establish);
      fillText('SOBRA', center, 700, 28, 800, P.black, 'center', establish);

      const arrowAlpha = Math.max(leftAdvance, rightAdvance);
      ctx.save();
      ctx.globalAlpha = arrowAlpha;
      ctx.fillStyle = P.black;
      ctx.beginPath();
      ctx.moveTo(leftBoundary - 30, 540);
      ctx.lineTo(leftBoundary - 70, 520);
      ctx.lineTo(leftBoundary - 70, 560);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(rightBoundary + 30, 540);
      ctx.lineTo(rightBoundary + 70, 520);
      ctx.lineTo(rightBoundary + 70, 560);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      const carry = easeOut((time - scene.start) / .42);
      fillText('RENDA R$ 4.200', lerp(96, 960, carry), lerp(340, 980, carry), lerp(180, 22, carry), 700, P.black, carry < 1 ? 'left' : 'center', .55 + .45 * (1 - carry));
      if (settle > 0) {
        fillText('A FOLGA FOI COMPRIMIDA', 960, 920, 28, 800, P.black, 'center', settle);
      }
    }

    function drawS004(scene, time) {
      background();
      const pEntry = progress(time, eventById(scene, 'S004-E01'));
      const pNegation = progress(time, eventById(scene, 'S004-E02'));
      const pPurchase = progress(time, eventById(scene, 'S004-E03'));
      const pAbsurd = progress(time, eventById(scene, 'S004-E04'));
      const pLock = progress(time, eventById(scene, 'S004-E05'));

      // Transição de saída nos últimos 300ms de S004
      const exitProgress = time > scene.end - 0.35 ? easeOut((time - (scene.end - 0.35)) / 0.35) : 0;
      const sceneAlpha = 1 - exitProgress * 0.75;
      const slideOutX = -exitProgress * 90;

      ctx.save();
      ctx.translate(slideOutX, 0);

      // 1. Barra âmbar + "O PROBLEMA"
      if (pEntry > 0) {
        const yOffset = (1 - pEntry) * 14;
        roundedRect(96, 112 + yOffset, 112, 12, 6, P.amber, pEntry * sceneAlpha);
        fillText('O PROBLEMA', 96, 250 + yOffset, 112, 900, P.black, 'left', pEntry * sceneAlpha, -4);
      }

      // 2. "NÃO É" — Elemento dominante com maior peso visual
      if (pNegation > 0) {
        const scale = lerp(0.97, 1.0, pNegation);
        const yOffset = (1 - pNegation) * 18;
        ctx.save();
        ctx.translate(86, 548 + yOffset);
        ctx.scale(scale, scale);
        fillText('NÃO É', 0, 0, 270, 900, P.amber, 'left', pNegation * sceneAlpha, -14);
        ctx.restore();
      }

      // 4. "UMA COMPRA"
      if (pPurchase > 0) {
        const yOffset = (1 - pPurchase) * 12;
        fillText('UMA COMPRA', 678, 734 + yOffset, 118, 900, P.black, 'left', pPurchase * sceneAlpha, -4);
      }

      // 5. "ABSURDA"
      if (pAbsurd > 0) {
        const yOffset = (1 - pAbsurd) * 14;
        fillText('ABSURDA', 678, 912 + yOffset, 176, 900, P.black, 'left', pAbsurd * sceneAlpha, -9);
      }

      // 6. Underline estrutural finalizando a composição
      if (pLock > 0) {
        const currentWidth = 920 * pLock;
        roundedRect(678, 940, currentWidth, 14, 7, P.black, pLock * sceneAlpha);
      }

      ctx.restore();
    }

    // ========================================================
    // S005 — PARALLEL_SHIFT (CO-COMP-06A)
    // "NORMAL, COMPARAÇÃO, DESPESAS fazem parte de um sistema que se move junto."
    // 1. estabelecer três trilhos
    // 2. estabelecer labels
    // 3. referência comum começa a se deslocar
    // 4. NORMAL responde
    // 5. COMPARAÇÃO responde
    // 6. DESPESAS responde
    // 7. os três terminam deslocados na mesma direção
    // ========================================================
    function drawS005(scene, time) {
      background();
      const pTracks = progress(time, eventById(scene, 'S005-E01'));
      const pDriver = progress(time, eventById(scene, 'S005-E02'));
      const pNormal = progress(time, eventById(scene, 'S005-E03'));
      const pComp = progress(time, eventById(scene, 'S005-E04'));
      const pExp = progress(time, eventById(scene, 'S005-E05'));
      const pRef = progress(time, eventById(scene, 'S005-E06'));
      const pShift = progress(time, eventById(scene, 'S005-E07'));
      const pLock = progress(time, eventById(scene, 'S005-E08'));
      const enterAlpha = easeOut((time - scene.start) / 0.35);

      // ACCENT_LINE: referencia compartilhada, sem ponta de seta.
      // O endpoint termina antes da zona do label superior.
      if (pRef > 0) {
        ctx.save();
        ctx.strokeStyle = P.lime;
        ctx.lineWidth = 30;
        ctx.lineCap = 'round';
        ctx.globalAlpha = 0.95 * pRef * enterAlpha;
        const startX = 610, startY = 904;
        const targetX = 1390, targetY = 220;
        const curX = lerp(startX, targetX, pRef);
        const curY = lerp(startY, targetY, pRef);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(curX, curY);
        ctx.stroke();
        ctx.restore();
      }

      if (pDriver > 0) {
        fillText('QUANDO A RENDA SOBE', 1824, 136, 28, 800, P.black, 'right', pDriver * enterAlpha, 2.4);
      }

      const shiftNormal = easeOut(clamp((pShift - 0.00) / 0.85));
      const shiftComp = easeOut(clamp((pShift - 0.08) / 0.85));
      const shiftExp = easeOut(clamp((pShift - 0.16) / 0.85));
      const xNorm = lerp(1196 - 240, 1196, shiftNormal);
      const xComp = lerp(1386 - 240, 1386, shiftComp);
      const xExp = lerp(1576 - 240, 1576, shiftExp);

      // TRACKS: terminacao ortogonal limpa antes dos blocos lime.
      if (pTracks > 0) roundedRect(560, 272, 636, 86, 18, P.black, pTracks * enterAlpha);
      if (pNormal > 0) {
        fillText('NORMAL', 96, 330, 82, 900, P.black, 'left', pNormal * enterAlpha, -4);
        roundedRect(xNorm, 272, 386, 86, 18, P.lime, pNormal * enterAlpha);
      }

      if (pTracks > 0) roundedRect(560, 522, 826, 86, 18, P.black, pTracks * enterAlpha);
      if (pComp > 0) {
        fillText('COMPARAÇÃO', 96, 580, 70, 900, P.black, 'left', pComp * enterAlpha, -4);
        roundedRect(xComp, 522, 268, 86, 18, P.lime, pComp * enterAlpha);
      }

      if (pTracks > 0) roundedRect(560, 772, 1016, 86, 18, P.black, pTracks * enterAlpha);
      if (pExp > 0) {
        fillText('DESPESAS', 96, 830, 82, 900, P.black, 'left', pExp * enterAlpha, -4);
        roundedRect(xExp, 772, 184, 86, 18, P.lime, pExp * enterAlpha);
      }

      if (pLock > 0) {
        fillText('O SISTEMA SE MOVE JUNTO', 1824, 966, 28, 800, P.black, 'right', pLock * enterAlpha, 2.4);
      }
    }
function drawS006(scene, time) {
      background();
      const pOld = progress(time, eventById(scene, 'S006-E01'));
      const pRise = progress(time, eventById(scene, 'S006-E02'));
      const pDeemp = progress(time, eventById(scene, 'S006-E03'));
      const pNormal = progress(time, eventById(scene, 'S006-E04'));
      const pLock = progress(time, eventById(scene, 'S006-E05'));
      const enterAlpha = easeOut((time - scene.start) / 0.35);

      // STOP_BEFORE: o trecho antigo termina antes de EXTRA.
      if (pOld > 0) {
        ctx.save();
        ctx.strokeStyle = P.black;
        ctx.lineWidth = 36;
        ctx.lineCap = 'round';
        ctx.globalAlpha = pOld * enterAlpha;
        ctx.beginPath();
        ctx.moveTo(-40, 990);
        ctx.lineTo(lerp(-40, 48, pOld), 990);
        ctx.stroke();
        ctx.restore();
      }

      // STOP_BEFORE + ROUTE_AROUND: o trecho ascendente inicia depois de EXTRA.
      if (pRise > 0) {
        ctx.save();
        ctx.strokeStyle = P.black;
        ctx.lineWidth = 36;
        ctx.lineCap = 'round';
        ctx.globalAlpha = pRise * enterAlpha;
        const curX = lerp(540, 1020, pRise);
        const curY = lerp(970, 511, pRise);
        ctx.beginPath();
        ctx.moveTo(540, 970);
        ctx.lineTo(curX, curY);
        ctx.stroke();
        ctx.restore();
      }

      // TRANSFORM_TO_UNDERLINE: o destaque acompanha a base de NORMAL.
      if (pRise > 0) {
        ctx.save();
        ctx.strokeStyle = P.lime;
        ctx.lineWidth = 36;
        ctx.lineCap = 'round';
        ctx.globalAlpha = pRise * enterAlpha;
        ctx.beginPath();
        ctx.moveTo(1020, 511);
        ctx.lineTo(lerp(1020, 1824, pRise), 511);
        ctx.stroke();
        ctx.restore();
      }

      if (pOld > 0) {
        const extraAlpha = pOld * lerp(1.0, 0.40, pDeemp) * enterAlpha;
        fillText('ANTES', 96, 774, 28, 800, P.black, 'left', extraAlpha, 2.4);
        fillText('EXTRA', 88, 928, 148, 900, P.black, 'left', extraAlpha, -7);
      }

      if (pNormal > 0) {
        const normAlpha = pNormal * enterAlpha;
        const normScale = lerp(0.97, 1.0, pNormal);
        fillText('AGORA', 1824, 154, 28, 800, P.black, 'right', normAlpha, 2.4);
        ctx.save();
        ctx.translate(1818, 438);
        ctx.scale(normScale, normScale);
        fillText('NORMAL', 0, 0, 252, 900, P.black, 'right', normAlpha, -14);
        ctx.restore();
        roundedRect(1824 - 804 * pNormal, 502, 804 * pNormal, 18, 9, P.lime, normAlpha);
      }

      if (pLock > 0) {
        const lockAlpha = pLock * enterAlpha;
        fillText('VIROU REFERÊNCIA', 1824, 636, 66, 900, P.black, 'right', lockAlpha, -4);
        fillText('O GANHO NÃO SUMIU • A BASE MUDOU', 1824, 964, 28, 800, P.black, 'right', lockAlpha, 2.4);
      }
    }

    let ACTIVE_MANIFEST = null;
    const allEvents = () => ACTIVE_MANIFEST.scenes.flatMap(scene => scene.events || []);
    const motionEvent = id => allEvents().find(event => event.event_id === id);
    const absoluteProgress = (time, id) => progress(time, motionEvent(id));

    function drawBaselineMotion(time, closing) {
      background();
      const prefix = closing ? 'S012' : 'S007';
      const pOld = absoluteProgress(time, `${prefix}-E01`);
      const pShift = absoluteProgress(time, `${prefix}-E03`);
      const pDeemphasis = absoluteProgress(time, `${prefix}-E04`) || pShift;
      const pLock = absoluteProgress(time, closing ? 'S012-E05' : 'S007-E03');
      ctx.save(); ctx.strokeStyle=P.black; ctx.lineWidth=36; ctx.lineCap='round';
      ctx.globalAlpha=pOld; ctx.beginPath(); ctx.moveTo(-40,990); ctx.lineTo(lerp(-40,48,pOld),990); ctx.stroke();
      if (pShift>0) { ctx.beginPath(); ctx.moveTo(540,970); ctx.lineTo(lerp(540,1020,pShift),lerp(970,511,pShift)); ctx.stroke(); }
      ctx.restore();
      if (pShift>0) { ctx.save(); ctx.strokeStyle=P.lime; ctx.lineWidth=18; ctx.lineCap='round'; ctx.globalAlpha=pShift; ctx.beginPath(); ctx.moveTo(1020,511); ctx.lineTo(lerp(1020,1788,pShift),511); ctx.stroke(); ctx.restore(); }
      const oldAlpha=pOld*lerp(1,.42,pDeemphasis);
      fillText(closing?'CONQUISTA':'REFERÊNCIA',96,774,28,800,P.black,'left',oldAlpha,2.4);
      fillText(closing?'EXTRA':'ANTIGA',96,928,132,900,P.black,'left',oldAlpha,-6);
      if (pLock>0) {
        fillText(closing?'NOVA ORIGEM':'NOVO',1788,154,28,800,P.black,'right',pLock,2.4);
        fillText(closing?'BASE':'NORMAL',1788,438,252,900,P.black,'right',pLock,-14);
        fillText(closing?'PONTO DE PARTIDA':'A RÉGUA SUBIU',1788,636,66,900,P.black,'right',pLock,-4);
        fillText(closing?'O NOVO NORMAL VIROU A ORIGEM':'O NORMAL SE MOVE',1788,964,28,800,P.black,'right',pLock,2.4);
      }
    }

    function phoneShape(x, brightness, alpha) {
      ctx.save(); ctx.globalAlpha=alpha;
      const rayAlpha=brightness;
      ctx.strokeStyle=P.lime; ctx.lineWidth=12; ctx.lineCap='round'; ctx.globalAlpha=alpha*rayAlpha;
      [[-190,260,-130,300],[190,260,130,300],[-210,520,-145,500],[210,520,145,500]].forEach(v=>{ctx.beginPath();ctx.moveTo(x+v[0],v[1]);ctx.lineTo(x+v[2],v[3]);ctx.stroke();});
      ctx.globalAlpha=alpha; roundedRect(x-130,250,260,500,48,P.black,1); roundedRect(x-108,284,216,410,28,P.offWhite,1);
      roundedRect(x-70,468,140,18,9,P.black,.72); roundedRect(x-50,510,100,18,9,P.black,.42);
      ctx.fillStyle=P.lime; ctx.globalAlpha=alpha*brightness; ctx.beginPath();ctx.arc(x,360,74,0,Math.PI*2);ctx.fill();ctx.restore();
    }

    function bridgeWave(alpha, amplitudeScale=1) {
      if (alpha<=0) return;
      ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=P.lime; ctx.lineWidth=20; ctx.lineCap='round'; ctx.beginPath();
      for(let x=180;x<=1740;x+=12){const t=(x-180)/1560;const amp=230*amplitudeScale*(1-.62*t);const y=600-Math.sin(t*Math.PI*5)*amp; if(x===180)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();ctx.restore();
    }

    function drawPhoneTransformation(time) {
      background();
      const enter=absoluteProgress(time,'S008-E01');
      const morph=absoluteProgress(time,'S009-E01');
      const routine=absoluteProgress(time,'S009-E03');

      if (scene.scene_id === 'S001') drawS001(scene, time);

      else if (scene.scene_id === 'S010') drawS010Motion(time);

      else if (scene.scene_id === 'S013') drawS013Motion(time);
      else if (scene.scene_id === 'S014') drawS014Motion(time);
      else if (scene.scene_id === 'S015' || scene.scene_id === 'S016') drawMaterialSequence(time);
      else drawEvidenceSequence(time);
      statusNode.textContent = `${scene.scene_id} · ${time.toFixed(2)}s${SILENT ? ' · silent' : ''}`;
    }

    async function start() {
      const manifestPath = QUERY.get('manifest') || 'manifest/scene_manifest_s001_s018.json';
      const manifest = await fetch(manifestPath).then(response => {
        if (!response.ok) throw new Error(`manifest HTTP ${response.status}`);
        return response.json();
      });
      ACTIVE_MANIFEST = manifest;
      const renderOrigin = Number(manifest.audio.render_origin_seconds || 0);
      const presentationDuration = Number(
        manifest.audio.presentation_duration_seconds || (manifest.audio.duration_seconds - renderOrigin)
      );
      renderFrame(renderOrigin, manifest);
      if (Number.isFinite(PREVIEW_TIME)) {
        renderFrame(clamp(PREVIEW_TIME, 0, manifest.audio.duration_seconds), manifest);
        statusNode.textContent = `preview · ${PREVIEW_TIME.toFixed(2)}s`;
        if (QUERY.get('capture') === '1') {
          canvas.toBlob(blob => fetch('/preview', {
            method: 'POST',
            headers: { 'Content-Type': 'image/png', 'X-Preview-Time': String(PREVIEW_TIME) },
            body: blob
          }), 'image/png');
        }
        return;
      }
      const audioData = await fetch(manifest.audio.player_path).then(response => {
        if (!response.ok) throw new Error(`audio HTTP ${response.status}`);
        return response.arrayBuffer();
      });
      const audioContext = new AudioContext({ sampleRate: 48000 });
      const audioBuffer = await audioContext.decodeAudioData(audioData);
      const source = audioContext.createBufferSource();
      source.buffer = audioBuffer;
      const audioDestination = audioContext.createMediaStreamDestination();
      source.connect(audioDestination);

      const videoStream = canvas.captureStream(30);
      const tracks = [...videoStream.getVideoTracks()];
      if (!SILENT) tracks.push(...audioDestination.stream.getAudioTracks());
      const combined = new MediaStream(tracks);
      const preferred = SILENT
        ? ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
        : ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
      const mimeType = preferred.find(type => MediaRecorder.isTypeSupported(type)) || '';
      const recorder = new MediaRecorder(combined, {
        mimeType,
        videoBitsPerSecond: 7000000,
        ...(!SILENT ? { audioBitsPerSecond: 128000 } : {})
      });
      const chunks = [];
      recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
      recorder.onerror = event => fetch('/error', { method: 'POST', body: String(event.error || event) });
      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
        await fetch('/save', {
          method: 'POST',
          headers: {
            'Content-Type': blob.type,
            'X-Duration': String(presentationDuration),
            'X-Source-Duration': String(audioBuffer.duration),
            'X-Render-Origin': String(renderOrigin),
            'X-Width': String(canvas.width),
            'X-Height': String(canvas.height),
            'X-Fps': '30',
            'X-Silent': String(SILENT)
          },
          body: blob
        });
      };

      await audioContext.resume();
      const startAt = audioContext.currentTime + .15;
      recorder.start(1000);
      source.start(startAt, renderOrigin);
      function tick() {
        const outputTime = Math.max(0, audioContext.currentTime - startAt);
        const sourceTime = renderOrigin + outputTime;
        renderFrame(sourceTime, manifest);
        if (outputTime < presentationDuration + .1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      source.onended = () => setTimeout(() => recorder.stop(), 280);
    }

    start().catch(error => {
      statusNode.textContent = `erro: ${error.message}`;
      fetch('/error', { method: 'POST', body: error.stack || String(error) });
    });
  </script>
</body>
</html>
