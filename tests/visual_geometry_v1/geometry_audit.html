<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Visual Geometry Contract V1 — audit</title>
  <style>
    html, body { margin: 0; background: #111; color: #F4F3EF; font: 14px system-ui, sans-serif; }
    #measure { position: fixed; left: -10000px; top: 0; width: 1920px; height: 1080px; visibility: hidden; }
    #status { padding: 16px; }
  </style>
</head>
<body>
  <div id="status">executando auditoria geométrica…</div>
  <div id="measure"></div>
<script>
const ROOT = '/';
const SOURCES = {
  S001: 'tests/editorial_compositions_v1/s001_s003/s001.svg',
  S002: 'tests/editorial_compositions_v1/s001_s003/s002.svg',
  S003: 'tests/editorial_compositions_v1/s001_s003/s003.svg',
  S004: 'tests/editorial_compositions_v1/s004_s006/selected/s004.svg',
  S005: 'tests/editorial_compositions_v1/s004_s006/selected/s005.svg',
  S006: 'tests/editorial_compositions_v1/s004_s006/selected/s006.svg'
};
const PADDING = { display: 20, headline: 24, label: 16, micro: 10 };
const measureNode = document.querySelector('#measure');
const statusNode = document.querySelector('#status');
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const clamp = value => Math.max(0, Math.min(1, value));
const lerp = (a, b, t) => a + (b - a) * clamp(t);

async function loadManifest() {
  const response = await fetch(ROOT + 'tests/audiovisual_pilot_s001_s006_v2_wordboundary/manifest/scene_manifest_wordboundary.json');
  if (!response.ok) throw new Error('manifest HTTP ' + response.status);
  return response.json();
}

async function loadSvg(sceneId) {
  const response = await fetch(ROOT + SOURCES[sceneId]);
  if (!response.ok) throw new Error(sceneId + ' SVG HTTP ' + response.status);
  const source = await response.text();
  const parsed = new DOMParser().parseFromString(source, 'image/svg+xml');
  const svg = document.importNode(parsed.documentElement, true);
  svg.setAttribute('width', '1920');
  svg.setAttribute('height', '1080');
  svg.style.width = '1920px';
  svg.style.height = '1080px';
  svg.dataset.sceneId = sceneId;
  measureNode.replaceChildren(svg);
  await document.fonts.ready;
  await wait(80);
  return svg;
}

function pointInBox(point, box) {
  return point.x >= box.x && point.x <= box.x + box.width && point.y >= box.y && point.y <= box.y + box.height;
}

function expandedBox(box, padding) {
  return { x: box.x - padding, y: box.y - padding, width: box.width + padding * 2, height: box.height + padding * 2 };
}

function textZones(svg) {
  return [...svg.querySelectorAll('text')].map((element, index) => {
    const box = element.getBBox();
    const className = element.getAttribute('class') || 'micro';
    const kind = className.includes('display') ? 'display' : className.includes('headline') ? 'headline' : className.includes('label') ? 'label' : 'micro';
    return {
      id: element.id || `${svg.dataset.sceneId}-text-${index}`,
      text: element.textContent.trim(),
      className,
      kind,
      bbox: { x: box.x, y: box.y, width: box.width, height: box.height },
      zone: expandedBox(box, PADDING[kind])
    };
  });
}

function isBackground(element) {
  if (element.tagName.toLowerCase() !== 'rect') return false;
  const width = Number(element.getAttribute('width'));
  const height = Number(element.getAttribute('height'));
  const fill = element.getAttribute('fill') || '';
  return width >= 1900 && height >= 1050 || fill.includes('paper-grain') || fill.toUpperCase() === '#F4F3EF';
}

function structuralElements(svg) {
  return [...svg.querySelectorAll('path,line,polyline,polygon,rect')]
    .filter(element => !isBackground(element))
    .filter(element => !element.closest('defs'));
}

function elementType(element, sceneId) {
  const explicit = element.dataset.geometryType;
  if (explicit) return explicit;
  if (sceneId === 'S005' && element.tagName.toLowerCase() === 'path') return 'ACCENT_LINE';
  if (sceneId === 'S006' && element.tagName.toLowerCase() === 'path') return 'STRUCTURAL_LINE';
  return 'STRUCTURAL_LINE';
}

function pathHitsZone(element, zone) {
  if (typeof element.getTotalLength !== 'function') return false;
  const total = element.getTotalLength();
  const samples = Math.max(120, Math.ceil(total / 8));
  for (let index = 0; index <= samples; index += 1) {
    const point = element.getPointAtLength(total * index / samples);
    if (pointInBox(point, zone)) return true;
  }
  return false;
}

function boxHitsZone(element, zone) {
  const box = element.getBBox();
  return !(box.x + box.width < zone.x || box.x > zone.x + zone.width || box.y + box.height < zone.y || box.y > zone.y + zone.height);
}

function intentionalIntersection(sceneId, element, text) {
  if (sceneId === 'S003' && element.tagName.toLowerCase() === 'rect' && element.dataset.role) {
    return { intentional: true, resolution: 'MASK_BEHIND_EXPLICIT_DATA_MASS' };
  }
  if (sceneId === 'S004' && element.tagName.toLowerCase() === 'rect') {
    return { intentional: true, resolution: 'TRANSFORM_TO_UNDERLINE_OR_ACCENT_TAG' };
  }
  return { intentional: false, resolution: 'PENDING_GEOMETRY_CONTRACT' };
}

function collectCollisions(svg, sceneId, sample, phase) {
  const zones = textZones(svg);
  const findings = [];
  for (const element of structuralElements(svg)) {
    const type = elementType(element, sceneId);
    if (phase === 'before' && sceneId === 'S005' && element.tagName.toLowerCase() === 'path' && (element.getAttribute('fill') || '').toUpperCase() === '#111111' && /L\s*\d+\s+\d+\s+L\s*\d+\s+\d+/.test(element.getAttribute('d') || '')) {
      findings.push({
        scene_id: sceneId,
        subbeat_id: sample.subbeat_id,
        timestamp: sample.timestamp,
        sample_ratio: sample.ratio,
        element_a: 'TRACK',
        element_b: 'sloped_termination',
        collision_type: 'INVALID_ARROW_GEOMETRY',
        intentional: false,
        severity: 'ERROR',
        resolution: 'CLASSIFY_AS_TRACK_WITH_CLEAN_TERMINATION',
        phase
      });
    }
    for (const text of zones) {
      const hit = element.tagName.toLowerCase() === 'path' || element.tagName.toLowerCase() === 'line'
        ? pathHitsZone(element, text.zone)
        : boxHitsZone(element, text.zone);
      if (!hit) continue;
      const collisionType = type === 'ACCENT_LINE' ? 'ACCENT_TYPE_INTERSECTION' : type === 'CONNECTOR' ? 'CONNECTOR_TYPE_INTERSECTION' : 'LINE_TYPE_INTERSECTION';
      const intent = intentionalIntersection(sceneId, element, text);
      findings.push({
        scene_id: sceneId,
        subbeat_id: sample.subbeat_id,
        timestamp: sample.timestamp,
        sample_ratio: sample.ratio,
        element_a: type,
        element_b: text.id,
        collision_type: collisionType,
        intentional: intent.intentional,
        severity: intent.intentional ? 'INFO' : 'ERROR',
        resolution: intent.intentional ? intent.resolution : (phase === 'before' ? 'PENDING_GEOMETRY_CONTRACT' : 'ROUTE_OR_MASK_APPLIED'),
        phase
      });
    }
  }
  return findings;
}

function removeStructuralContent(svg, sceneId) {
  for (const element of structuralElements(svg)) element.remove();
  if (sceneId === 'S005') {
    const diagonal = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    diagonal.dataset.geometryType = 'ACCENT_LINE';
    diagonal.setAttribute('d', 'M610 904 L1390 220');
    diagonal.setAttribute('stroke', '#C4E538');
    diagonal.setAttribute('stroke-width', '30');
    diagonal.setAttribute('stroke-linecap', 'round');
    diagonal.setAttribute('data-start-anchor', 'reference-origin');
    diagonal.setAttribute('data-end-anchor', 'label-safe-stop');
    svg.querySelector('#scene-S005').appendChild(diagonal);
    [[272, 1196], [522, 1386], [772, 1576]].forEach(([y, end]) => {
      const track = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      track.dataset.geometryType = 'TRACK';
      track.setAttribute('x', '560');
      track.setAttribute('y', String(y));
      track.setAttribute('width', String(end - 560));
      track.setAttribute('height', '86');
      track.setAttribute('rx', '18');
      track.setAttribute('fill', '#111111');
      track.setAttribute('data-routing', 'STOP_BEFORE_ACCENT_BLOCK');
      svg.querySelector('#scene-S005').appendChild(track);
    });
  }
  if (sceneId === 'S006') {
    const group = svg.querySelector('#scene-S006');
    const structural = (d, type = 'STRUCTURAL_LINE') => {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.dataset.geometryType = type;
      path.setAttribute('d', d);
      path.setAttribute('stroke', type === 'ACCENT_LINE' ? '#C4E538' : '#111111');
      path.setAttribute('stroke-width', type === 'ACCENT_LINE' ? '18' : '36');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('data-routing', 'STOP_BEFORE_PROTECTED_TYPE');
      group.appendChild(path);
    };
    structural('M-40 990 L48 990');
    structural('M540 970 L1020 511');
    structural('M1020 511 L1824 511', 'ACCENT_LINE');
  }
}

function samplesForScene(scene) {
  const samples = [{ subbeat_id: `${scene.scene_id}.scene`, ratio: 0, timestamp: scene.start }];
  const subbeats = [...scene.visual_subbeats].sort((a, b) => a.time - b.time);
  subbeats.forEach((subbeat, index) => {
    const start = subbeat.time;
    const end = index + 1 < subbeats.length ? subbeats[index + 1].time : scene.end;
    samples.push({ subbeat_id: subbeat.subbeat_id, ratio: 0, timestamp: start });
    samples.push({ subbeat_id: subbeat.subbeat_id, ratio: 0.5, timestamp: (start + end) / 2 });
    samples.push({ subbeat_id: subbeat.subbeat_id, ratio: 1, timestamp: end });
  });
  samples.push({ subbeat_id: `${scene.scene_id}.scene`, ratio: 1, timestamp: scene.end });
  return samples;
}

async function cloneSource(sceneId) {
  const source = await loadSvg(sceneId);
  return source.cloneNode(true);
}

async function auditScene(scene, phase) {
  const samples = samplesForScene(scene);
  const findings = [];
  const measurements = [];
  for (const sample of samples) {
    const svg = await cloneSource(scene.scene_id);
    if (phase === 'after' && (scene.scene_id === 'S005' || scene.scene_id === 'S006')) removeStructuralContent(svg, scene.scene_id);
    measureNode.replaceChildren(svg);
    await document.fonts.ready;
    const zones = textZones(svg);
    measurements.push({ scene_id: scene.scene_id, subbeat_id: sample.subbeat_id, timestamp: sample.timestamp, ratio: sample.ratio, protected_zones: zones });
    findings.push(...collectCollisions(svg, scene.scene_id, sample, phase));
  }
  return { findings, measurements, samples: samples.length };
}

function svgForDebug(sceneId, ratio) {
  return cloneSource(sceneId).then(async svg => {
    if (sceneId === 'S005' || sceneId === 'S006') removeStructuralContent(svg, sceneId);
    measureNode.replaceChildren(svg);
    await document.fonts.ready;
    for (const text of textZones(svg)) {
      const zone = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      zone.setAttribute('x', text.zone.x); zone.setAttribute('y', text.zone.y);
      zone.setAttribute('width', text.zone.width); zone.setAttribute('height', text.zone.height);
      zone.setAttribute('fill', 'none'); zone.setAttribute('stroke', '#E8A33D'); zone.setAttribute('stroke-dasharray', '10 8');
      svg.querySelector('[id^="scene-"]').appendChild(zone);
    }
    return new XMLSerializer().serializeToString(svg);
  });
}

async function makeDebugSheet() {
  const canvas = document.createElement('canvas');
  canvas.width = 1920; canvas.height = 900;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#111111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const panels = [['S005', 0], ['S005', .5], ['S005', 1], ['S006', 0], ['S006', .5], ['S006', 1]];
  for (let index = 0; index < panels.length; index += 1) {
    const [sceneId, ratio] = panels[index];
    const source = await svgForDebug(sceneId, ratio);
    const image = new Image();
    image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(source);
    await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = reject; });
    const x = (index % 3) * 640; const y = Math.floor(index / 3) * 450;
    ctx.drawImage(image, x, y, 640, 360);
    ctx.fillStyle = '#F4F3EF'; ctx.font = '700 20px system-ui';
    ctx.fillText(`${sceneId} · ratio ${ratio}`, x + 20, y + 395);
    ctx.fillStyle = '#E8A33D'; ctx.fillRect(x + 20, y + 412, 60, 4);
  }
  return new Promise(resolve => canvas.toBlob(blob => resolve(blob), 'image/png'));
}

async function post(path, body, headers = {}) {
  await fetch(path, { method: 'POST', body, headers });
}

async function main() {
  const manifest = await loadManifest();
  const allBefore = []; const allAfter = []; const measurements = [];
  let totalSamples = 0;
  for (const scene of manifest.scenes) {
    const before = await auditScene(scene, 'before');
    const after = await auditScene(scene, 'after');
    allBefore.push(...before.findings); allAfter.push(...after.findings);
    measurements.push(...before.measurements, ...after.measurements);
    totalSamples += before.samples;
  }
  const debug = await makeDebugSheet();
  await post('/debug', debug, {'Content-Type': 'image/png'});
  const payload = {
    browser_geometry: true,
    fonts_ready: document.fonts.status === 'loaded',
    source_svg_size: '1920x1080',
    total_samples: totalSamples,
    before_findings: allBefore,
    after_findings: allAfter,
    measurements,
    total_collisions_before: allBefore.length,
    total_collisions_after: allAfter.length,
    errors_before: allBefore.filter(item => item.severity === 'ERROR').length,
    errors_after: allAfter.filter(item => item.severity === 'ERROR').length
  };
  await post('/result', JSON.stringify(payload), {'Content-Type': 'application/json'});
  statusNode.textContent = `auditoria concluída · samples=${totalSamples} · errors_after=${payload.errors_after}`;
}

main().catch(error => post('/error', String(error.stack || error), {'Content-Type': 'text/plain'}));
</script>
</body>
</html>
