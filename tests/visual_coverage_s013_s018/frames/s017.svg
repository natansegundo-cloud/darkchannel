      CAPITAL OCULTO — CHARACTER RIG V4
      Production-safe architecture:
      - body parts are <g> in ONE shared 320x640 coordinate system
      - only char-base is a <symbol>
      - no symbol-inside-symbol viewport nesting
      - static scenes use ONE <use href="#char-base">
      - animated scenes assemble the same parts with <use href="#char-...">
    -->

